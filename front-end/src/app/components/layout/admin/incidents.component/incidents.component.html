<main>
  <h1>Incidentes</h1>
  <h2>Gerencie os incidentes reportados nos recursos da empresa</h2>

  <section class="section-cards">
    <div class="div-filter">
      <div><h4>Status</h4></div>
      <div><h4>Tipos de Ocorrência</h4></div>
    </div>

    <div class="div-cards">
      <app-card-incident 
        *ngFor="let incident of incidents"
        [incident]="incident">
      </app-card-incident>

      <p *ngIf="incidents.length === 0">Nenhum incidente encontrado.</p>
    </div>
  </section>
</main>
