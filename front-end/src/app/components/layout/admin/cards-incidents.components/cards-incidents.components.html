<article class="card">
  <div class="div-labels">
    <span class="label">{{ incident.status }}</span>
    <span class="label">Severidade {{ incident.severity }}</span>
  </div>
  <h3>{{ incident.name }}</h3>
  <p>{{ incident.description }}</p>
  <p>Reportado em: {{ incident.dateIncident}}</p>
  <a href="" class="details">Ver Detalhes</a>
</article>
