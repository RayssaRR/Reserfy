<div class="card">

    <h3>{{ request.resource.name }}</h3>

    <p>Solicitado por: <strong>{{ request.user.name }}</strong></p>

    <p>Período da Reserva:</p>
    <p>
        {{ request.startDate }} - {{ request.endDate }}
    </p>

    <!-- BADGE DE STATUS -->
    <div 
        class="badge"
        [ngClass]="{
            'pending': request.status === 'PENDENTE',
            'approved': request.status === 'APROVADO',
            'rejected': request.status === 'RECUSADO'
        }"
    >
        {{ request.status }}
    </div>

    <!-- BOTÕES (somente para pendentes) -->
    <div class="actions" *ngIf="request.status === 'PENDENTE'">

        <button class="reject">
            Rejeitar
        </button>

        <button class="approve">
            Aprovar
        </button>

    </div>

</div>
